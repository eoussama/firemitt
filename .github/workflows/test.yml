name: Unit Tests

on:
  push:
    branches:
      - main
      - develop
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v7

    - name: Setup pnpm
      uses: pnpm/action-setup@v6

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 24.x
        cache: pnpm

    - name: Install Dependencies
      run: pnpm install --frozen-lockfile

    - name: Check (audit, lint, build, coverage, mutation testing, docs)
      run: pnpm check

    - name: Check the published entry points
      run: |
        node -e "const m = require('./dist/firemitt.umd.cjs'); if (!m.FiremittHelper || !m.EventHelper || !m.Base64helper) process.exit(1)"
        node --input-type=module -e "const m = await import('./dist/firemitt.es.js'); if (!m.FiremittHelper || !m.EventHelper || !m.Base64helper) process.exit(1)"
