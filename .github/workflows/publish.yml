name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  npm:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Setup pnpm
      uses: pnpm/action-setup@v6

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 24.x
        cache: pnpm
        registry-url: "https://registry.npmjs.org/"

    - name: Install Dependencies
      run: pnpm install --frozen-lockfile

    - name: Build and Test
      run: |
        pnpm build
        pnpm test

    - name: Publish Package
      run: pnpm publish --access public --no-git-checks --ignore-scripts
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  github:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Setup pnpm
      uses: pnpm/action-setup@v6

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 24.x
        cache: pnpm

    - name: Install Dependencies
      run: pnpm install --frozen-lockfile

    - name: Build
      run: pnpm build

    - name: Setup GitHub Packages Registry
      run: |
        npm config set @eoussama:registry https://npm.pkg.github.com
        npm config set //npm.pkg.github.com/:_authToken "$NODE_AUTH_TOKEN"
      env:
        NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Publish Package
      run: pnpm publish --no-git-checks --ignore-scripts
